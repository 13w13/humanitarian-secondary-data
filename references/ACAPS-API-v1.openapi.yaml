  /api/v1/inform-severity-index/{date}/:
    get:
      operationId: retrieveSeverityIndexMonthly
      description: 'The INFORM Severity Index, formerly known as the Global Crisis
        Severity Index (GCSI), is an improved, timely way of measuring the severity
        of humanitarian crises and disasters globally. The INFORM Severity Index is
        a sensitive, regularly updated, and easily interpreted model for measuring
        crisis severity that can assist decision-makers and contribute to improved
        effectiveness and coordination in humanitarian action.


        This dataset contains the final GCSI INFORM Severity results, including overall
        severity scores, overall reliability scores, and categories. Overall severity
        scores are calculated by combining the scores from the Impact of Crisis, Conditions
        of Affected People, and Complexity datasets.<p class=''dataset-link''>Explore
        the dataset [here](/api/v1/inform-severity-index/).</p>'
      parameters:
      - name: date
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: crisis_id
        required: false
        in: query
        description: ID of the crisis e.g. AFG001
        schema:
          type: string
      - name: crisis_name
        required: false
        in: query
        description: Name of the crisis
        schema:
          type: string
      - name: type_of_crisis
        required: false
        in: query
        description: Type of crisis, e.g. 'Complex crisis'
        schema:
          type: string
      - name: regional_or_country
        required: false
        in: query
        description: 'Whether the crisis is country wide or regional, options: ''Country''
          or ''Regional'''
        schema:
          type: string
      - name: website_name
        required: false
        in: query
        description: Website name of the crisis
        schema:
          type: string
      - name: iso3
        required: false
        in: query
        description: ISO3 code, e.g. AFG
        schema:
          type: array
      - name: drivers
        required: false
        in: query
        description: Drivers of the crisis e.g. 'Conflict'
        schema:
          type: array
      - name: country
        required: false
        in: query
        description: Country name, e.g. 'Afghanistan'
        schema:
          type: array
      - name: regions
        required: false
        in: query
        description: Region names, e.g. 'Asia'
        schema:
          type: array
      - name: country_level
        required: false
        in: query
        description: When there is only one crisis in the country, the crisis provides
          a score for the country level. If there are multiple crisis within a country,
          the country level crisis is an aggregation of the impact of the different
          situations at country level.
        schema:
          type: string
      - name: individual_aggregated
        required: false
        in: query
        description: Individual crises are scores specific to one crisis, whereas
          aggregated crises consider all active crises present in a country.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeverityIndexMonthly'
          description: ''
      tags:
      - inform-severity-index
