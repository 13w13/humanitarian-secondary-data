  /api/v1/turkiye-syria-earthquake/inform-severity-index/{date}/:
    get:
      operationId: retrieveInformSeverityIndexLog
      description: 'The INFORM Severity Index, formerly known as the Global Crisis
        Severity Index (GCSI), is an improved, timely way of measuring the severity
        of humanitarian crises and disasters globally. The INFORM Severity Index is
        a sensitive, regularly updated, and easily interpreted model for measuring
        crisis severity that can assist decision-makers and contribute to improved
        effectiveness and coordination in humanitarian action.


        This dataset contains the final GCSI INFORM Severity results, including overall
        severity scores, overall reliability scores, and categories. Overall severity
        scores are calculated by combining the scores from the Impact of Crisis, Conditions
        of Affected People, and Complexity datasets. Please note that due to the calculations
        involved in generating these results the response may be slower than usual.<p
        class=''dataset-link''>Explore the dataset [here](/api/v1/turkiye-syria-earthquake/inform-severity-index/).</p>'
      parameters:
      - name: date
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformSeverityIndexLog'
          description: ''
      tags:
      - turkiye-syria-earthquake
