openapi: 3.0.2
info:
  title: ACAPS API
  version: v1
  description: <p>We are an independent information provider specialised in humanitarian
    needs analysis.</p><p>You can find detailed information on using ACAPS API, including
    authentication, making requests, and filtering and ordering the response, and
    hands-on examples in Python, R, and Power BI <a href='/practical-guide/'>here</a>.</p>
paths:
  /api/v1/crises/:
    get:
      operationId: listCrises
      description: This dataset is a central list of the crises monitored by ACAPS.<p
        class='dataset-link'>Explore the dataset [here](/api/v1/crises/).</p>
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: crisis_id
        required: false
        in: query
        description: crisis_id
        schema:
          type: string
      - name: crisis_name
        required: false
        in: query
        description: crisis_name
        schema:
          type: string
      - name: website_name
        required: false
        in: query
        description: website_name
        schema:
          type: string
      - name: drivers
        required: false
        in: query
        description: drivers
        schema:
          type: string
      - name: country_level
        required: false
        in: query
        description: country_level
        schema:
          type: string
      - name: date_created
        required: false
        in: query
        description: date_created
        schema:
          type: string
      - name: country
        required: false
        in: query
        description: country
        schema:
          type: string
      - name: iso3
        required: false
        in: query
        description: iso3
        schema:
          type: string
      - name: regions
        required: false
        in: query
        description: regions
        schema:
          type: string
      - name: regional_or_country
        required: false
        in: query
        description: regional_or_country
        schema:
          type: string
      - name: individual_aggregated
        required: false
        in: query
        description: individual_aggregated
        schema:
          type: string
      - name: active
        required: false
        in: query
        description: active
        schema:
          type: string
      - name: geoscope
        required: false
        in: query
        description: geoscope
        schema:
          type: string
      - name: connected_crises
        required: false
        in: query
        description: connected_crises
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Crisis'
          description: ''
      tags:
      - crises
